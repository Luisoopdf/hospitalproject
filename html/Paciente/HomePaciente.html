    <script>
        // Small fix: ensure .card anchors navigate even if CSS overlays block pointer events
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.card').forEach(function (el) {
                // allow pointer events in case CSS set pointer-events: none
                el.style.pointerEvents = el.style.pointerEvents || 'auto';

                if (el.tagName.toLowerCase() === 'a' && el.getAttribute('href')) {
                    // make keyboard Enter/Space work and ensure navigation
                    el.addEventListener('keydown', function (e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            location.assign(this.getAttribute('href'));
                        }
                    });
                    // ensure click always navigates (prevent double fallback)
                    el.addEventListener('click', function (e) {
                        e.preventDefault();
                        location.assign(this.getAttribute('href'));
                    });
                } else {
                    var href = el.getAttribute('data-href');
                    if (href) {
                        el.style.cursor = 'pointer';
                        el.addEventListener('click', function () { location.assign(href); });
                        el.addEventListener('keydown', function (e) {
                            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); location.assign(href); }
                        });
                    }
                }
            });
        });
    </script>
