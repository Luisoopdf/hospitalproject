<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gestión de Usuarios</title>
  <link rel="icon" href="/img/logo.ico" />

  <link rel="stylesheet" href="/css/Recepcionista/GestionarUsuarios.css" />
  <script src="/js/Recepcionista/GestionarUsuarios.js" defer></script>
</head>

<body>
  <!-- TOP BAR (idéntica a la que enviaste) -->
  <header class="topbar">
    <div class="topbar-left">
      <img class="topbar-logo" src="/img/logo.png" alt="Hospital San Mungo" />
      <span class="brand-title">Hospital San Mungo</span>

      <button id="btnVolverPerfil" class="btn-link small" type="button" title="Volver al perfil">
        Volver a perfil
      </button>
    </div>

    <div class="topbar-right">
      <span class="pill pill-role" title="Vista exclusiva para recepcionista">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z" fill="currentColor" opacity=".25"/>
          <path d="M4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        </svg>
        Recepcionista
      </span>

      <button id="btnLogout" class="btn-link" type="button" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M10 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <path d="M3 12h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M9 8l4 4-4 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Cerrar Sesión
      </button>
    </div>
  </header>

  <main class="page">
    <section class="wrap">
      <div class="head">
        <div>
          <h1 class="title">Gestionar Usuarios</h1>
          <p class="subtitle">Administra y organiza la base de datos de usuarios</p>
        </div>
      </div>

      <!-- Acciones principales -->
      <section class="card toolbar">
        <div class="toolbar-left">
          <button id="btnRegistrar" class="btn btn-primary" type="button">
            <span class="btn-ic" aria-hidden="true">＋</span>
            Registrar Usuario
          </button>

          <button id="btnModoEliminar" class="btn btn-outline" type="button">
            <span class="btn-ic" aria-hidden="true">🗑</span>
            Eliminar Usuario
          </button>
        </div>

        <div class="toolbar-right" id="deleteActions" hidden>
          <span class="hint">Selecciona usuarios y confirma la eliminación.</span>
          <button id="btnEliminarSeleccionados" class="btn btn-danger" type="button" disabled>
            Eliminar seleccionados
          </button>
          <button id="btnSalirEliminar" class="btn btn-ghost" type="button">
            Salir
          </button>
        </div>
      </section>

      <!-- Filtro (mismo diseño que GestionarCitas: filters filters-box) -->
      <div class="filters filters-box">
        <div class="filters-title">Filtrar usuarios</div>
      
        <div class="filters-row">
          <div class="filters-field">
            <label for="f_nombre">Nombre</label>
            <input id="f_nombre" type="text" placeholder="Ej. María Rodríguez" />
          </div>
      
          <div class="filters-field">
            <label for="f_tipo">Tipo de usuario</label>
            <select id="f_tipo">
              <option value="">Todos</option>
              <option value="Paciente">Paciente</option>
              <option value="Doctor">Doctor</option>
              <option value="Recepcionista">Recepcionista</option>
              <option value="Farmaceutico">Farmaceutico</option>
            </select>
          </div>
      
          <button id="btnFiltrarUsuarios" class="btn btn-primary" type="button">Filtrar</button>
          <button id="btnLimpiarFiltroUsuarios" class="btn btn-outline" type="button">Limpiar</button>
        </div>
      </div>
      

      <!-- Tabla -->
      <section class="card">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th class="col-check">
                  <input id="checkAll" type="checkbox" class="chk" hidden />
                </th>
                <th>Id Usuario</th>
                <th>Nombre</th>
                <th>Tipo de Usuario</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody id="tbodyUsuarios">
              <!-- JS render -->
            </tbody>
          </table>
        </div>

        <div class="table-foot">
          <div class="muted" id="txtConteo">Mostrando 0 resultados</div>
        </div>
      </section>
    </section>
  </main>

  <!-- Modal genérico (solo para demo de "Registrar Usuario" si quieres) -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">Acción</div>
        <button id="btnCloseModalX" class="icon-btn" type="button" title="Cerrar">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot">
        <button id="btnCloseModal" class="btn btn-primary" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
