<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./img/logo.ico">
    <link rel="stylesheet" href="./css/template.css">
    <link rel="stylesheet" href="./css/login.css">
    <title>Bienvenido al Hospital San Mungo</title>
</head>

<body>

    <main class="login">
        <div class="logo-img">
            <img src="./img/logo.png" alt="logo">
        </div>
        <form id="loginForm">
            <fieldset>
                <legend>Inicia Sesión</legend>

                <label>Correo: </label>
                <input id="correo" type="text" placeholder="Ingresa Tu Correo" required>

                <label>Contraseña: </label>
                <input id="password" type="password" placeholder="Ingresa Tu Contraseña" required>

                <label style="display: flex; align-items: center; font-size: 0.9em;">
                    <input type="checkbox" id="showPassword" style="margin-right: 5px;">
                    Mostrar contraseña
                </label>

                <button type="submit">Ingresar</button>
                <a href="./html/CrearCuenta.html">Crear Cuenta</a>
            </fieldset>
        </form>
    </main>
</body>

</html>

<script>
    const showPassword = document.getElementById('showPassword');
    const passwordInput = document.getElementById('password');

    showPassword.addEventListener('change', () => {
        passwordInput.type = showPassword.checked ? 'text' : 'password';
    });
</script>

<script src="http://localhost:3000/js/login-paciente.js"></script>
